<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>AR SnapCam</title>

<script src="https://cdn.jsdelivr.net/npm/deepar@5.6.22/js/deepar.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{position:fixed;inset:0;background:#000}
#deepar-div{position:absolute;inset:0;width:100%;height:100%;background:#000}
#deepar-div canvas{width:100%!important;height:100%!important;object-fit:cover}

.top{position:absolute;z-index:20;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;direction:ltr}
.btn{width:46px;height:46px;border:0;border-radius:50%;background:rgba(0,0,0,.42);backdrop-filter:blur(12px);color:#fff;display:grid;place-items:center}
svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.bottom{position:absolute;z-index:20;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.68))}
.filters{direction:ltr;display:flex;gap:14px;overflow-x:auto;padding:18px calc(50vw - 38px) 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 76px;width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.13);display:grid;place-items:center;position:relative}
.filter.active{transform:scale(1.12);border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.16)}
.filter span{font-size:33px}
.filter small{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:8px;font-weight:900;text-shadow:0 1px 4px #000}

.controls{height:94px;display:flex;align-items:center;justify-content:center;position:relative}
.shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.13)}
.shutter:after{content:"";display:block;width:59px;height:59px;border-radius:50%;background:#fff;margin:auto}
.save{position:absolute;right:26px;width:47px;height:47px;border:0;border-radius:50%;background:rgba(0,0,0,.42);color:#fff;display:grid;place-items:center}
.save:disabled{opacity:.35}

.overlay{position:absolute;z-index:100;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center}
.overlay.hidden{display:none}
.loader{width:40px;height:40px;border:4px solid #333;border-top-color:#fff;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{color:#aaa;line-height:1.6;font-size:13px;margin:0}

.errorbox{max-width:430px;background:#111;border:1px solid #222;border-radius:24px;padding:24px}
.errorbox h2{margin:0 0 10px}
.errordetail{direction:ltr;text-align:left;background:#050505;border:1px solid #222;border-radius:12px;padding:10px;margin-top:12px;font-size:11px;word-break:break-word;color:#ff9f9f}
.retry{margin-top:16px;border:0;border-radius:999px;background:#fff;color:#000;font-weight:900;padding:12px 22px}

.toast{position:absolute;z-index:80;top:75px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:8px 14px;border-radius:999px;font-size:12px;opacity:0;transition:.2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="deepar-div"></div>

  <div class="top">
    <button id="flipBtn" class="btn">
      <svg viewBox="0 0 24 24"><path d="M20 7h-4l-2-2h-4L8 7H4v12h16z"/><path d="M16 11l2 2-2 2M8 15l-2-2 2-2"/><circle cx="12" cy="13" r="3"/></svg>
    </button>
    <button id="clearBtn" class="btn">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div id="toast" class="toast"></div>

  <div class="bottom">
    <div class="filters" id="filters">
      <button class="filter active" data-effect="" data-name="عادي"><span>✨</span><small>عادي</small></button>
      <button class="filter" data-effect="https://cdn.jsdelivr.net/npm/deepar@5.6.22/effects/aviators" data-name="Aviators"><span>😎</span><small>نظارة</small></button>
    </div>

    <div class="controls">
      <button id="captureBtn" class="shutter"></button>
      <button id="saveBtn" class="save" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      </button>
    </div>
  </div>

  <div id="loading" class="overlay">
    <div>
      <div class="loader"></div>
      <p id="loadingText">جاري تشغيل DeepAR والكاميرا…</p>
    </div>
  </div>

  <div id="errorPanel" class="overlay hidden">
    <div class="errorbox">
      <h2>تعذر تشغيل DeepAR</h2>
      <p>الرسالة الموجودة بالأسفل ستبين السبب الحقيقي.</p>
      <div id="errorDetail" class="errordetail"></div>
      <button id="retryBtn" class="retry">إعادة المحاولة</button>
    </div>
  </div>
</div>

<script>
const DEEPAR_LICENSE_KEY = 'e17ae1d5bb6471807b7e66c4b7f735c3e94a4146be0a6e4464d62bc13b4038718fdba6965ded10eb';

let deepAR = null;
let currentFacingMode = "user";
let lastScreenshot = null;
let starting = false;

const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const errorPanel = document.getElementById("errorPanel");
const errorDetail = document.getElementById("errorDetail");
const toastEl = document.getElementById("toast");
const filters = document.getElementById("filters");
const saveBtn = document.getElementById("saveBtn");

function toast(t) {
  toastEl.textContent = t;
  toastEl.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(()=>toastEl.classList.remove("show"),1200);
}

function showLoading(t) {
  loadingText.textContent = t;
  loading.classList.remove("hidden");
}

function hideLoading() {
  loading.classList.add("hidden");
}

function showError(err) {
  hideLoading();
  let msg = err?.message || String(err);
  errorDetail.textContent = msg;
  errorPanel.classList.remove("hidden");
}

async function startDeepAR() {
  if(starting) return;
  starting = true;
  errorPanel.classList.add("hidden");
  showLoading("جاري تشغيل الكاميرا…");

  try {
    if(!DEEPAR_LICENSE_KEY || DEEPAR_LICENSE_KEY === "PASTE_YOUR_LICENSE_KEY_HERE") {
      throw new Error("License key missing");
    }

    if(deepAR) {
      try { await deepAR.shutdown(); } catch(e) {}
      deepAR = null;
    }

    // مهم: نبدأ بدون أي effect حتى لا يمنع رابط فلتر خاطئ تشغيل الكاميرا.
    deepAR = await deepar.initialize({
      licenseKey: DEEPAR_LICENSE_KEY,
      previewElement: document.querySelector("#deepar-div"),
      additionalOptions: {
        cameraConfig: {
          facingMode: currentFacingMode
        }
      }
    });

    hideLoading();
    toast("الكاميرا جاهزة ✓");
  } catch(err) {
    console.error(err);
    showError(err);
  } finally {
    starting = false;
  }
}

filters.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", async () => {
    if(!deepAR) return toast("الكاميرا غير جاهزة");

    const effect = btn.dataset.effect;
    const name = btn.dataset.name;

    try {
      showLoading(effect ? "جاري تحميل الفلتر…" : "جاري إزالة الفلتر…");

      if(effect) {
        await deepAR.switchEffect(effect);
      } else {
        await deepAR.clearEffect();
      }

      filters.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
      btn.classList.add("active");

      hideLoading();
      toast(name);
    } catch(err) {
      console.error(err);
      showError(err);
    }
  });
});

document.getElementById("clearBtn").onclick = async () => {
  if(!deepAR) return;
  try {
    await deepAR.clearEffect();
    filters.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
    filters.querySelector('[data-effect=""]').classList.add("active");
    toast("بدون فلتر");
  } catch(err) {
    showError(err);
  }
};

document.getElementById("flipBtn").onclick = async () => {
  if(!deepAR || starting) return;
  currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
  await startDeepAR();
};

document.getElementById("captureBtn").onclick = async () => {
  if(!deepAR) return toast("الكاميرا غير جاهزة");
  try {
    lastScreenshot = await deepAR.takeScreenshot();
    saveBtn.disabled = false;
    toast("تم التصوير ✓");
  } catch(err) {
    showError(err);
  }
};

saveBtn.onclick = () => {
  if(!lastScreenshot) return;
  const a = document.createElement("a");
  a.href = lastScreenshot;
  a.download = "AR-SnapCam-" + Date.now() + ".png";
  document.body.appendChild(a);
  a.click();
  a.remove();
};

document.getElementById("retryBtn").onclick = startDeepAR;

window.addEventListener("load", () => setTimeout(startDeepAR, 100));
</script>
</body>
</html>
